<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ペットカメラ（送信側）</title>
<style>
  body { background:#000; color:#fff; font-family:sans-serif; text-align:center; }
  button { padding:10px 20px; margin:10px; font-size:18px; }
  input { padding:10px; font-size:18px; }
</style>
</head>
<body>

<h2>ペットカメラ（送信側）</h2>

<p>パスワードを入力してください</p>
<input id="password" type="password">

<br>
<button id="startBtn">配信開始</button>
<button id="audioToggleOut">こちらの音声OFF</button>

<p id="viewerCount" style="font-size:20px; margin-top:10px;">視聴者数：0人</p>

<!-- Safari が描画を認識するための最小 video（完全非表示） -->
<video id="localVideo" autoplay playsinline muted
       style="position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;"></video>

<!-- 受信側からの音声（ハウリング防止のため常に muted） -->
<audio id="remoteAudio" autoplay muted></audio>

<!-- 画面全体を黒で覆う -->
<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:black;z-index:9999;"></div>

<script>
const signalingUrl = "wss://pet-camera-server-1.onrender.com";

let localStream;
let ws;
let peers = {};
let audioOutEnabled = true;

// ★こちらの音声ON/OFF
document.getElementById("audioToggleOut").onclick = () => {
    audioOutEnabled = !audioOutEnabled;
    document.getElementById("audioToggleOut").innerText =
        audioOutEnabled ? "こちらの音声OFF" : "こちらの音声ON";
    if (localStream) {
        localStream.getAudioTracks().forEach(t => t.enabled = audioOutEnabled);
    }
};

// ★4Mbps 高画質用 SDP 書き換え
function forceHighQuality(sdp) {
    return sdp.replace(
        /a=fmtp:96 .*\r\n/,
        "a=fmtp:96 x-google-max-bitrate=4000000;x-google-min-bitrate=2000000;x-google-start-bitrate=3000000\r\n"
    );
}

// ★配信開始
document.getElementById("startBtn").onclick = async () => {
    const password = document.getElementById("password").value;

    // Safari 互換のカメラ設定（背面・720p）
    localStream = await navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: "environment",
            width: 1280,
            height: 720,
            frameRate: 30
        },
        audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
        }
    });

    document.getElementById("localVideo").srcObject = localStream;

    ws = new WebSocket(signalingUrl);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type:"auth", password }));
    };

    ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        if (data.type === "viewer-count") {
            document.getElementById("viewerCount").innerText =
                `視聴者数：${data.count}人`;
        }

        if (data.type === "receiver-joined") {
            const receiverId = data.receiverId;

            const peer = createPeer(receiverId);
            peers[receiverId] = peer;

            let offer = await peer.createOffer();
            offer.sdp = forceHighQuality(offer.sdp);   // ★ここで4Mbpsに
            await peer.setLocalDescription(offer);

            await waitIce(peer);

            ws.send(JSON.stringify({
                type:"offer",
                offer:peer.localDescription,
                receiverId
            }));
        }

        if (data.type === "answer") {
            const peer = peers[data.receiverId];
            if (peer) {
                await peer.setRemoteDescription(data.answer);
            }
        }

        if (data.type === "candidate") {
            const peer = peers[data.receiverId];
            if (peer) {
                try { await peer.addIceCandidate(data.candidate); }
                catch(e){ console.error(e); }
            }
        }
    };
};

// ★PeerConnection 作成
function createPeer(receiverId) {
    const peer = new RTCPeerConnection();

    // 映像＋音声を送信
    localStream.getTracks().forEach(t => peer.addTrack(t, localStream));

    // 受信側からの音声（ハウリング防止のため muted audio にだけ流す）
    peer.ontrack = (e) => {
        if (e.track.kind === "audio") {
            const audioStream = new MediaStream([e.track]);
            const audio = document.getElementById("remoteAudio");
            audio.srcObject = audioStream;
        }
    };

    peer.onicecandidate = (e) => {
        if (e.candidate && ws) {
            ws.send(JSON.stringify({
                type:"candidate",
                candidate:e.candidate,
                receiverId
            }));
        }
    };

    return peer;
}

// ICE 完了待ち
function waitIce(peer) {
    return new Promise(resolve => {
        if (peer.iceGatheringState === "complete") resolve();
        peer.onicegatheringstatechange = () => {
            if (peer.iceGatheringState === "complete") resolve();
        };
    });
}
</script>

</body>
</html>
