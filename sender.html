<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ペットカメラ（送信側）</title>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; text-align: center; }
  video { width: 90%; margin-top: 20px; background: #000; }
  button { padding: 10px 20px; margin: 10px; font-size: 18px; }
  input { padding: 10px; font-size: 18px; }
</style>
</head>
<body>

<h2>ペットカメラ（送信側）</h2>

<p>パスワードを入力してください</p>
<input id="password" type="password">

<br>
<button id="startBtn">配信開始</button>
<button id="audioToggle">音声OFF</button>

<video id="localVideo" autoplay playsinline muted></video>

<script>
const signalingUrl = "wss://pet-camera-server-1.onrender.com"; // ←あなたのURLに変更
let localStream;
let peer;
let audioEnabled = false;

document.getElementById("audioToggle").onclick = () => {
    audioEnabled = !audioEnabled;
    document.getElementById("audioToggle").innerText = audioEnabled ? "音声ON" : "音声OFF";
    if (localStream) {
        localStream.getAudioTracks().forEach(t => t.enabled = audioEnabled);
    }
};

document.getElementById("startBtn").onclick = async () => {
    const password = document.getElementById("password").value;

    localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: "environment" } }, // 外カメラ
        audio: true
    });

    document.getElementById("localVideo").srcObject = localStream;

    const ws = new WebSocket(signalingUrl);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type: "auth", password }));
    };

    ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        if (data.type === "auth-ok") {
            peer = new RTCPeerConnection();

            localStream.getTracks().forEach(t => peer.addTrack(t, localStream));

            peer.onicecandidate = (e) => {
                if (e.candidate) ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
            };

            const offer = await peer.createOffer();
            await peer.setLocalDescription(offer);

            ws.send(JSON.stringify({ type: "offer", offer }));
        }

        if (data.type === "answer") {
            await peer.setRemoteDescription(data.answer);
        }

        if (data.type === "candidate") {
            await peer.addIceCandidate(data.candidate);
        }
    };
};
</script>

</body>
</html>
