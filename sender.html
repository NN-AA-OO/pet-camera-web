<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Pet Camera Sender (iPad)</title>
  <style>
    body { background: #111; color: #eee; text-align: center; font-family: sans-serif; }
    video { width: 90vw; max-width: 800px; background: #000; }
    input, button { margin-top: 10px; padding: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Pet Camera Sender (iPad)</h1>

  <input id="pw" type="password" placeholder="パスワードを入力"><br>
  <button id="startBtn">配信開始</button><br>

  <video id="localVideo" autoplay playsinline></video>

  <script>
    const signalingUrl = "wss://pet-camera-server.onrender.com";
    let signalingSocket;
    let peer;

    const pw = document.getElementById("pw");
    const startBtn = document.getElementById("startBtn");
    const localVideo = document.getElementById("localVideo");

    async function start() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          frameRate: { ideal: 30 }
        },
        audio: false
      });

      localVideo.srcObject = stream;

      peer = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      stream.getTracks().forEach(track => peer.addTrack(track, stream));

      peer.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal({ type: "candidate", candidate: event.candidate });
        }
      };

      peer.onnegotiationneeded = async () => {
        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);
        sendSignal({ type: "offer", sdp: offer.sdp });
      };

      connectSignaling();
    }

    function connectSignaling() {
      signalingSocket = new WebSocket(signalingUrl);

      signalingSocket.onopen = () => {
        signalingSocket.send(JSON.stringify({ password: pw.value }));
      };

      signalingSocket.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "auth") {
          if (data.status === "fail") {
            alert("パスワードが違います");
            signalingSocket.close();
          }
          return;
        }

        if (data.type === "answer") {
          await peer.setRemoteDescription(new RTCSessionDescription({
            type: "answer",
            sdp: data.sdp
          }));
        } else if (data.type === "candidate") {
          await peer.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      };
    }

    function sendSignal(payload) {
      signalingSocket.send(JSON.stringify(payload));
    }

    startBtn.onclick = () => start();
  </script>
</body>
</html>
