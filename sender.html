<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ペットカメラ（送信側）</title>
<style>
  body { background:#000; color:#fff; font-family:sans-serif; text-align:center; }

  /* 統一デザインのボタン */
  .btn {
    padding:12px 20px;
    margin:10px;
    font-size:18px;
    background:#555;
    color:#fff;
    border:none;
    border-radius:6px;
  }

  /* ★receiver と完全に揃えた input */
  input {
    padding:10px;
    font-size:18px;
    border-radius:6px;
    width:200px;
  }
</style>

</head>
<body>

<h2>ペットカメラ（送信側）</h2>

<!-- 初期画面（パスワード入力） -->
<div id="authArea">
  <p>パスワードを入力してください</p>
  <input id="password" type="password">
  <br>
  <button id="startBtn" class="btn">配信開始</button>
</div>

<!-- 配信画面 -->
<div id="streamArea" style="display:none;">

  <!-- ★黒画面の上に重ねて表示する配信終了ボタン -->
  <button id="stopBtn" class="btn" style="
      display:none;
      position:fixed;
      top:20px;
      right:20px;
      z-index:10000;
  ">
      配信終了
  </button>

  <!-- Safari が WebRTC を維持するための最小 video（完全非表示） -->
  <video id="localVideo" autoplay playsinline muted
        style="position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;"></video>

  <!-- 受信側からの音声（初期は muted） -->
  <audio id="remoteAudio" autoplay></audio>

  <!-- 黒画面（省エネ） -->
  <div id="blackCover" style="
      position:fixed;
      top:0;
      left:0;
      width:100vw;
      height:100vh;
      background:black;
      z-index:9999;
      display:block;
      color:#888;
      font-size:24px;
      font-weight:bold;
      text-align:center;
      padding-top:35vh;
  ">
      配信中<br>
      <span id="viewerText" style="font-size:18px; opacity:0.7;">0人視聴中</span>
  </div>
</div>

<script>
const signalingUrl = "wss://pet-camera-server-1.onrender.com";

let localStream;
let ws;
let peers = {};

// ★高画質 SDP 書き換え
function forceHighQuality(sdp) {
    const videoMatch = sdp.match(/m=video \d+ RTP\/SAVPF ([0-9 ]+)/);
    if (!videoMatch) return sdp;

    const pts = videoMatch[1].trim().split(" ");
    const pt = pts[0];

    const fmtpRegex = new RegExp(`a=fmtp:${pt} .*\\r\\n`);
    if (!fmtpRegex.test(sdp)) return sdp;

    return sdp.replace(
        fmtpRegex,
        `a=fmtp:${pt} x-google-max-bitrate=6000000;x-google-min-bitrate=3000000;x-google-start-bitrate=4500000\r\n`
    );
}

// ★配信開始
document.getElementById("startBtn").onclick = async () => {
    const password = document.getElementById("password").value;

    // UI 切り替え
    document.getElementById("authArea").style.display = "none";
    document.getElementById("streamArea").style.display = "block";

    // カメラ＋マイク取得
    localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:"environment", width:1280, height:720, frameRate:30 },
        audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true }
    });

    document.getElementById("localVideo").srcObject = localStream;

    // WebSocket 接続
    ws = new WebSocket(signalingUrl);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type:"auth", password }));
    };

    ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        if (data.type === "viewer-count") {
            document.getElementById("viewerText").innerText = `${data.count}人視聴中`;
        }

        if (data.type === "receiver-joined") {
            const receiverId = data.receiverId;

            if (peers[receiverId]) {
                try { peers[receiverId].close(); } catch(e){}
            }

            const peer = createPeer(receiverId);
            peers[receiverId] = peer;

            let offer = await peer.createOffer();
            offer.sdp = forceHighQuality(offer.sdp);
            await peer.setLocalDescription(offer);

            await waitIce(peer);

            ws.send(JSON.stringify({
                type:"offer",
                offer:peer.localDescription,
                receiverId
            }));
        }

        if (data.type === "answer") {
            const peer = peers[data.receiverId];
            if (peer) await peer.setRemoteDescription(data.answer);
        }

        if (data.type === "candidate") {
            const peer = peers[data.receiverId];
            if (peer) {
                try { await peer.addIceCandidate(data.candidate); }
                catch(e){}
            }
        }
    };

    // ★配信終了ボタンを表示
    document.getElementById("stopBtn").style.display = "inline-block";
};

// ★配信終了（初期画面に戻す）
document.getElementById("stopBtn").onclick = () => {

    if (ws) ws.close();
    ws = null;

    Object.values(peers).forEach(peer => {
        try { peer.close(); } catch(e){}
    });
    peers = {};

    if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
    }

    // UI 初期化
    document.getElementById("streamArea").style.display = "none";
    document.getElementById("authArea").style.display = "block";

    document.getElementById("viewerText").innerText = "0人視聴中";

    // ボタン非表示
    document.getElementById("stopBtn").style.display = "none";
};

// ★PeerConnection 作成
function createPeer(receiverId) {
    const peer = new RTCPeerConnection();

    // 映像＋音声を送信
    localStream.getTracks().forEach(t => peer.addTrack(t, localStream));

    // 受信者の音声を受け取るための transceiver
    peer.addTransceiver("audio", { direction:"recvonly" });

    // 受信者からの音声を受信
    peer.ontrack = (e) => {
        if (e.track.kind === "audio") {
            let audioStream = document.getElementById("remoteAudio").srcObject;
            if (!audioStream) {
                audioStream = new MediaStream();
                document.getElementById("remoteAudio").srcObject = audioStream;
            }
            audioStream.addTrack(e.track);
        }
    };

    peer.onicecandidate = (e) => {
        if (e.candidate && ws) {
            ws.send(JSON.stringify({
                type:"candidate",
                candidate:e.candidate,
                receiverId
            }));
        }
    };

    return peer;
}

// ICE 完了待ち
function waitIce(peer) {
    return new Promise(resolve => {
        if (peer.iceGatheringState === "complete") resolve();
        peer.onicegatheringstatechange = () => {
            if (peer.iceGatheringState === "complete") resolve();
        };
    });
}
</script>

</body>
</html>
