<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ペットカメラ（送信側）</title>
<style>
  body { background:#111; color:#fff; font-family:sans-serif; text-align:center; }
  video { width:90%; margin-top:20px; background:#000; }
  button { padding:10px 20px; margin:10px; font-size:18px; }
  input { padding:10px; font-size:18px; }
</style>
</head>
<body>

<h2>ペットカメラ（送信側）</h2>

<p>パスワードを入力してください</p>
<input id="password" type="password">

<br>
<button id="startBtn">配信開始</button>
<button id="audioToggleOut">こちらの音声OFF</button>

<p id="viewerCount" style="font-size:20px; margin-top:10px;">視聴者数：0人</p>

<video id="localVideo" autoplay playsinline muted></video>
<audio id="remoteAudio" autoplay></audio>

<script>
const signalingUrl = "wss://pet-camera-server-1.onrender.com";

let localStream;
let ws;
let peers = {};
let audioOutEnabled = true;

// ★音声ON/OFF
document.getElementById("audioToggleOut").onclick = () => {
    audioOutEnabled = !audioOutEnabled;
    document.getElementById("audioToggleOut").innerText =
        audioOutEnabled ? "こちらの音声OFF" : "こちらの音声ON";
    if (localStream) {
        localStream.getAudioTracks().forEach(t => t.enabled = audioOutEnabled);
    }
};

// ★配信開始
document.getElementById("startBtn").onclick = async () => {
    const password = document.getElementById("password").value;

    // ★Safari互換のカメラ設定
    localStream = await navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: "environment",
            width: 1280,
            height: 720,
            frameRate: 30
        },
        audio: true
    });

    document.getElementById("localVideo").srcObject = localStream;

    ws = new WebSocket(signalingUrl);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type:"auth", password }));
    };

    ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        if (data.type === "viewer-count") {
            document.getElementById("viewerCount").innerText =
                `視聴者数：${data.count}人`;
        }

        if (data.type === "receiver-joined") {
            const receiverId = data.receiverId;

            const peer = createPeer(receiverId);
            peers[receiverId] = peer;

            const offer = await peer.createOffer();
            await peer.setLocalDescription(offer);

            await waitIce(peer);

            ws.send(JSON.stringify({
                type:"offer",
                offer:peer.localDescription,
                receiverId
            }));
        }

        if (data.type === "answer") {
            const peer = peers[data.receiverId];
            if (peer) {
                await peer.setRemoteDescription(data.answer);
            }
        }

        if (data.type === "candidate") {
            const peer = peers[data.receiverId];
            if (peer) {
                try { await peer.addIceCandidate(data.candidate); }
                catch(e){ console.error(e); }
            }
        }
    };
};

// ★PeerConnection作成
function createPeer(receiverId) {
    const peer = new RTCPeerConnection();

    // ★映像＋音声を送信
    localStream.getTracks().forEach(t => peer.addTrack(t, localStream));

    // ★受信側からの音声を受け取る
    peer.ontrack = (e) => {
        const audioStream = new MediaStream([e.track]);
        document.getElementById("remoteAudio").srcObject = audioStream;
    };

    peer.onicecandidate = (e) => {
        if (e.candidate && ws) {
            ws.send(JSON.stringify({
                type:"candidate",
                candidate:e.candidate,
                receiverId
            }));
        }
    };

    return peer;
}

// ★ICE完了待ち
function waitIce(peer) {
    return new Promise(resolve => {
        if (peer.iceGatheringState === "complete") resolve();
        peer.onicegatheringstatechange = () => {
            if (peer.iceGatheringState === "complete") resolve();
        };
    });
}
</script>

</body>
</html>
