<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ペットカメラ（受信側）</title>
<style>
  body { background:#111; color:#fff; font-family:sans-serif; text-align:center; }
  video {
    width:90%; height:auto; max-height:70vh;
    background:#000; margin-top:20px;
  }

  /* 接続・接続終了ボタンは元のシンプルな灰色 */
  #connectBtn, #disconnectBtn {
    padding:10px 20px;
    margin:10px;
    font-size:18px;
    background:#555;
    color:#fff;
    border:none;
    border-radius:6px;
  }

  /* 音声ボタンは ON＝緑 / OFF＝赤 */
  .on  { background:#2ecc71; color:#fff; } /* 緑 */
  .off { background:#e74c3c; color:#fff; } /* 赤 */

  input { padding:10px; font-size:18px; }
</style>
</head>
<body>

<h2>ペットカメラ（受信側）</h2>

<div id="authArea">
  <p>パスワードを入力してください</p>
  <input id="password" type="password">
  <br>
  <button id="connectBtn">接続</button>
</div>

<div id="streamArea" style="display:none;">
  <button id="disconnectBtn">接続終了</button>

  <!-- 初期状態：自分のマイク OFF（赤） -->
  <button id="audioToggleIn" class="off" disabled>マイク OFF</button>

  <!-- 初期状態：相手の音声 OFF（赤） -->
  <button id="audioToggleOut" class="off" disabled>相手の音声 OFF</button>

  <p id="viewerCount" style="font-size:20px; margin-top:10px;">視聴者数：0人</p>

  <video id="remoteVideo" autoplay playsinline muted></video>

  <!-- 初期状態：相手の音声は muted -->
  <audio id="remoteAudio" autoplay muted></audio>
</div>

<script>
const signalingUrl = "wss://pet-camera-server-1.onrender.com";

let ws;
let peer;
let receiverId;

let micEnabled = false;          // 初期はマイク OFF
let remoteAudioEnabled = false;  // 初期は相手の音声 OFF
let localAudioStream;

// ★マイク ON/OFF
document.getElementById("audioToggleIn").onclick = () => {
    micEnabled = !micEnabled;

    const btn = document.getElementById("audioToggleIn");
    btn.innerText = micEnabled ? "マイク ON" : "マイク OFF";
    btn.className = micEnabled ? "on" : "off";

    if (localAudioStream) {
        localAudioStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
    }
};

// ★相手の音声 ON/OFF
document.getElementById("audioToggleOut").onclick = () => {
    remoteAudioEnabled = !remoteAudioEnabled;

    const btn = document.getElementById("audioToggleOut");
    btn.innerText = remoteAudioEnabled ? "相手の音声 ON" : "相手の音声 OFF";
    btn.className = remoteAudioEnabled ? "on" : "off";

    document.getElementById("remoteAudio").muted = !remoteAudioEnabled;
};

// ★接続開始
document.getElementById("connectBtn").onclick = async () => {
    const password = document.getElementById("password").value;

    document.getElementById("authArea").style.display = "none";
    document.getElementById("streamArea").style.display = "block";

    ws = new WebSocket(signalingUrl);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type:"auth", password }));
    };

    ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        if (data.type === "viewer-count") {
            document.getElementById("viewerCount").innerText =
                `視聴者数：${data.count}人`;
        }

        if (data.type === "receiver-id") {
            receiverId = data.receiverId;
        }

        if (data.type === "offer") {

            if (peer) {
                try { peer.close(); } catch(e){}
                peer = null;
            }

            peer = new RTCPeerConnection();

            peer.ontrack = (e) => {
                if (e.track.kind === "video") {
                    let vs = remoteVideo.srcObject;
                    if (!vs) {
                        vs = new MediaStream();
                        remoteVideo.srcObject = vs;
                    }
                    vs.addTrack(e.track);
                }

                if (e.track.kind === "audio") {
                    let as = remoteAudio.srcObject;
                    if (!as) {
                        as = new MediaStream();
                        remoteAudio.srcObject = as;
                    }
                    as.addTrack(e.track);
                }
            };

            peer.onicecandidate = (e) => {
                if (e.candidate && ws) {
                    ws.send(JSON.stringify({
                        type:"candidate",
                        candidate:e.candidate,
                        receiverId
                    }));
                }
            };

            // ★自分のマイク（初期は OFF）
            localAudioStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                },
                video:false
            });

            localAudioStream.getAudioTracks().forEach(t => {
                t.enabled = micEnabled;
                peer.addTrack(t, localAudioStream);
            });

            await peer.setRemoteDescription(data.offer);
            const answer = await peer.createAnswer();
            await peer.setLocalDescription(answer);

            await waitIce(peer);

            ws.send(JSON.stringify({
                type:"answer",
                answer:peer.localDescription,
                receiverId
            }));

            // ボタン有効化
            document.getElementById("audioToggleIn").disabled = false;
            document.getElementById("audioToggleOut").disabled = false;
        }

        if (data.type === "candidate") {
            if (peer) {
                try { await peer.addIceCandidate(data.candidate); }
                catch(e){}
            }
        }
    };
};

// ★接続終了
document.getElementById("disconnectBtn").onclick = () => {

    if (ws) ws.close();
    ws = null;

    if (peer) {
        try { peer.close(); } catch(e){}
    }
    peer = null;

    if (localAudioStream) {
        localAudioStream.getTracks().forEach(t => t.stop());
    }

    remoteVideo.srcObject = null;
    remoteAudio.srcObject = null;

    // 初期状態に戻す
    micEnabled = false;
    remoteAudioEnabled = false;

    document.getElementById("audioToggleIn").innerText = "マイク OFF";
    document.getElementById("audioToggleIn").className = "off";
    document.getElementById("audioToggleIn").disabled = true;

    document.getElementById("audioToggleOut").innerText = "相手の音声 OFF";
    document.getElementById("audioToggleOut").className = "off";
    document.getElementById("audioToggleOut").disabled = true;

    document.getElementById("remoteAudio").muted = true;

    document.getElementById("streamArea").style.display = "none";
    document.getElementById("authArea").style.display = "block";

    document.getElementById("viewerCount").innerText = "視聴者数：0人";
};

// ICE 完了待ち
function waitIce(peer) {
    return new Promise(resolve => {
        if (peer.iceGatheringState === "complete") resolve();
        peer.onicegatheringstatechange = () => {
            if (peer.iceGatheringState === "complete") resolve();
        };
    });
}
</script>

</body>
</html>
