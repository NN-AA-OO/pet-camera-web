<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ペットカメラ（受信側）</title>
<style>
  body { background:#111; color:#fff; font-family:sans-serif; text-align:center; }
  video {
    width:90%; height:auto; max-height:70vh;
    background:#000; margin-top:20px;
  }
  button { padding:10px 20px; margin:10px; font-size:18px; }
  input { padding:10px; font-size:18px; }
</style>
</head>
<body>

<h2>ペットカメラ（受信側）</h2>

<p>パスワードを入力してください</p>
<input id="password" type="password">

<br>
<button id="connectBtn">接続</button>
<button id="audioToggleIn">こちらのマイクOFF</button>
<button id="audioToggleOut">相手の音声OFF</button>

<p id="viewerCount" style="font-size:20px; margin-top:10px;">視聴者数：0人</p>

<video id="remoteVideo" autoplay playsinline muted></video>
<audio id="remoteAudio" autoplay></audio>

<script>
const signalingUrl = "wss://pet-camera-server-1.onrender.com";

let ws;
let peer;
let receiverId;

let micEnabled = true;
let remoteAudioEnabled = true;
let localAudioStream;

// ★自分のマイクON/OFF
document.getElementById("audioToggleIn").onclick = () => {
    micEnabled = !micEnabled;
    document.getElementById("audioToggleIn").innerText =
        micEnabled ? "こちらのマイクOFF" : "こちらのマイクON";
    if (localAudioStream) {
        localAudioStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
    }
};

// ★相手の音声ON/OFF
document.getElementById("audioToggleOut").onclick = () => {
    remoteAudioEnabled = !remoteAudioEnabled;
    document.getElementById("audioToggleOut").innerText =
        remoteAudioEnabled ? "相手の音声OFF" : "相手の音声ON";
    document.getElementById("remoteAudio").muted = !remoteAudioEnabled;
};

// ★接続
document.getElementById("connectBtn").onclick = async () => {
    const password = document.getElementById("password").value;

    ws = new WebSocket(signalingUrl);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type:"auth", password }));
    };

    ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        if (data.type === "viewer-count") {
            document.getElementById("viewerCount").innerText =
                `視聴者数：${data.count}人`;
        }

        if (data.type === "receiver-id") {
            receiverId = data.receiverId;
        }

        if (data.type === "offer") {
            if (!peer) {
                peer = new RTCPeerConnection();

                // ★トラックごとに処理（Safari必須）
                peer.ontrack = (e) => {
                    if (e.track.kind === "video") {
                        const vs = new MediaStream([e.track]);
                        document.getElementById("remoteVideo").srcObject = vs;
                    }
                    if (e.track.kind === "audio") {
                        const as = new MediaStream([e.track]);
                        document.getElementById("remoteAudio").srcObject = as;
                    }
                };

                peer.onicecandidate = (e) => {
                    if (e.candidate && ws) {
                        ws.send(JSON.stringify({
                            type:"candidate",
                            candidate:e.candidate,
                            receiverId
                        }));
                    }
                };

                // ★自分のマイクを送信
                localAudioStream = await navigator.mediaDevices.getUserMedia({
                    audio:true,
                    video:false
                });
                localAudioStream.getAudioTracks().forEach(t => {
                    t.enabled = micEnabled;
                    peer.addTrack(t, localAudioStream);
                });
            }

            await peer.setRemoteDescription(data.offer);
            const answer = await peer.createAnswer();
            await peer.setLocalDescription(answer);

            await waitIce(peer);

            ws.send(JSON.stringify({
                type:"answer",
                answer:peer.localDescription,
                receiverId
            }));
        }

        if (data.type === "candidate") {
            if (peer) {
                try { await peer.addIceCandidate(data.candidate); }
                catch(e){ console.error(e); }
            }
        }
    };
};

function waitIce(peer) {
    return new Promise(resolve => {
        if (peer.iceGatheringState === "complete") resolve();
        peer.onicegatheringstatechange = () => {
            if (peer.iceGatheringState === "complete") resolve();
        };
    });
}
</script>

</body>
</html>
