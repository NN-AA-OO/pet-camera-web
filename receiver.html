<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ペットカメラ（受信側）</title>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; text-align: center; }
  video { width: 90%; margin-top: 20px; background: #000; }
  button { padding: 10px 20px; margin: 10px; font-size: 18px; }
  input { padding: 10px; font-size: 18px; }
</style>
</head>
<body>

<h2>ペットカメラ（受信側）</h2>

<p>パスワードを入力してください</p>
<input id="password" type="password">

<br>
<button id="connectBtn">接続</button>
<button id="audioToggle">音声OFF</button>

<p id="viewerCount" style="font-size:20px; margin-top:10px;">視聴者数：0人</p>

<video id="remoteVideo" autoplay playsinline></video>

<script>
const signalingUrl = "wss://pet-camera-server-1.onrender.com"; // ★あなたのURLに変更
let peer;
let audioEnabled = false;

// ★音声ON/OFF
document.getElementById("audioToggle").onclick = () => {
    audioEnabled = !audioEnabled;
    document.getElementById("audioToggle").innerText = audioEnabled ? "音声ON" : "音声OFF";
    if (peer) {
        peer.getReceivers().forEach(r => {
            if (r.track.kind === "audio") r.track.enabled = audioEnabled;
        });
    }
};

// ★接続
document.getElementById("connectBtn").onclick = () => {
    const password = document.getElementById("password").value;

    const ws = new WebSocket(signalingUrl);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type: "auth", password }));
    };

    ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        if (data.type === "viewer-count") {
            document.getElementById("viewerCount").innerText =
                `視聴者数：${data.count}人`;
        }

        if (data.type === "auth-ok") {
            peer = new RTCPeerConnection();

            peer.ontrack = (e) => {
                document.getElementById("remoteVideo").srcObject = e.streams[0];
            };

            peer.onicecandidate = (e) => {
                if (e.candidate) ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
            };
        }

        if (data.type === "offer") {
            await peer.setRemoteDescription(data.offer);
            const answer = await peer.createAnswer();
            await peer.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: "answer", answer }));
        }

        if (data.type === "candidate") {
            await peer.addIceCandidate(data.candidate);
        }
    };
};
</script>

</body>
</html>
