<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ペットカメラ（受信側）</title>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; text-align: center; }

  video {
    width: 90%;
    height: auto;
    max-height: 70vh;
    background: transparent;
    margin-top: 20px;
    position: relative;
    z-index: 10;
  }

  button { padding: 10px 20px; margin: 10px; font-size: 18px; }
  input { padding: 10px; font-size: 18px; }
</style>
</head>
<body>

<h2>ペットカメラ（受信側）</h2>

<p>パスワードを入力してください</p>
<input id="password" type="password">

<br>
<button id="connectBtn">接続</button>
<button id="audioToggleIn">こちらのマイクOFF</button>
<button id="audioToggleOut">相手の音声OFF</button>

<p id="viewerCount" style="font-size:20px; margin-top:10px;">視聴者数：0人</p>

<video id="remoteVideo" autoplay playsinline></video>

<script>
const signalingUrl = "wss://pet-camera-server-1.onrender.com"; // ★あなたのURLに変更
let ws = null;
let peer = null;
let receiverId = null;

let localAudioStream = null;      // iPhone側マイク
let micEnabled = true;            // 自分のマイクON/OFF
let remoteAudioEnabled = true;    // 相手の音声ON/OFF

// ★自分のマイクON/OFF（iPhone → iPad）
document.getElementById("audioToggleIn").onclick = () => {
    micEnabled = !micEnabled;
    document.getElementById("audioToggleIn").innerText =
        micEnabled ? "こちらのマイクOFF" : "こちらのマイクON";
    if (localAudioStream) {
        localAudioStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
    }
};

// ★相手の音声ON/OFF（iPad → iPhone）
document.getElementById("audioToggleOut").onclick = () => {
    remoteAudioEnabled = !remoteAudioEnabled;
    document.getElementById("audioToggleOut").innerText =
        remoteAudioEnabled ? "相手の音声OFF" : "相手の音声ON";

    const video = document.getElementById("remoteVideo");
    video.muted = !remoteAudioEnabled;
};

// ★接続
document.getElementById("connectBtn").onclick = async () => {
    const password = document.getElementById("password").value;

    ws = new WebSocket(signalingUrl);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type: "auth", password }));
    };

    ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        // ★視聴者数表示
        if (data.type === "viewer-count") {
            document.getElementById("viewerCount").innerText =
                `視聴者数：${data.count}人`;
        }

        // ★認証成功
        if (data.type === "auth-ok") {
            console.log("receiver 認証OK");
        }

        // ★自分の receiverId を受信
        if (data.type === "receiver-id") {
            receiverId = data.receiverId;
            console.log("自分の receiverId=", receiverId);
        }

        // ★offer が来た時点で peer を作る
        if (data.type === "offer") {
            if (!peer) {
                peer = new RTCPeerConnection();

                // ★映像＋音声を受信
                peer.ontrack = (e) => {
                    const stream = e.streams[0];
                    document.getElementById("remoteVideo").srcObject = stream;
                    // 相手の音声ON/OFFは video.muted で制御
                    document.getElementById("remoteVideo").muted = !remoteAudioEnabled;
                };

                // ★ICE candidate を送信
                peer.onicecandidate = (e) => {
                    if (e.candidate && ws && receiverId != null) {
                        ws.send(JSON.stringify({
                            type: "candidate",
                            candidate: e.candidate,
                            receiverId
                        }));
                    }
                };

                // ★自分のマイクを取得して送信（双方向音声）
                localAudioStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: false
                });
                localAudioStream.getAudioTracks().forEach(t => {
                    t.enabled = micEnabled;
                    peer.addTrack(t, localAudioStream);
                });
            }

            // ★offer を適用
            await peer.setRemoteDescription(data.offer);

            // ★answer 作成
            const answer = await peer.createAnswer();
            await peer.setLocalDescription(answer);

            // ★ICE 完了を待ってから送る
            await waitForIceComplete(peer);

            ws.send(JSON.stringify({
                type: "answer",
                answer: peer.localDescription,
                receiverId
            }));
        }

        // ★candidate
        if (data.type === "candidate") {
            if (peer) {
                try {
                    await peer.addIceCandidate(data.candidate);
                } catch (e) {
                    console.error("addIceCandidate error", e);
                }
            }
        }

        // ★sender が切断された
        if (data.type === "sender-disconnected") {
            console.log("送信側が切断されました");
            // 必要なら UI に「配信終了」と表示するなど
        }
    };
};

// ★ICE gathering 完了を待つ
function waitForIceComplete(peer) {
    return new Promise(resolve => {
        if (peer.iceGatheringState === "complete") {
            resolve();
        } else {
            peer.onicegatheringstatechange = () => {
                if (peer.iceGatheringState === "complete") {
                    resolve();
                }
            };
        }
    });
}
</script>

</body>
</html>
